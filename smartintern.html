<style>
:root{
  --bg: #F6F5FC;
  --bg-alt: #FFFFFF;
  --surface: #FFFFFF;
  --surface-2: #F0EEFB;
  --border: #E4E1F5;
  --text: #211D3B;
  --text-soft: #605C7E;
  --text-faint: #918DB0;
  --indigo: #4F3FE0;
  --indigo-dark: #3B2EB8;
  --violet: #8B5CF6;
  --blue: #2F6FED;
  --green: #1C9A6C;
  --amber: #C6790A;
  --red: #D6446A;
  --font-display: 'Space Grotesk', 'Segoe UI', sans-serif;
  --font-body: 'Inter', 'Segoe UI', sans-serif;
  --shadow: 0 1px 2px rgba(33,29,59,0.04), 0 8px 24px rgba(33,29,59,0.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg: #16142A;
    --bg-alt: #1D1B36;
    --surface: #211F3E;
    --surface-2: #292650;
    --border: #37325F;
    --text: #F1EFFB;
    --text-soft: #B8B4DA;
    --text-faint: #837EB0;
    --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 8px 24px rgba(0,0,0,0.35);
  }
}
:root[data-theme="dark"]{
  --bg: #16142A;
  --bg-alt: #1D1B36;
  --surface: #211F3E;
  --surface-2: #292650;
  --border: #37325F;
  --text: #F1EFFB;
  --text-soft: #B8B4DA;
  --text-faint: #837EB0;
  --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 8px 24px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);}
body{
  font-family: var(--font-body);
  color: var(--text);
  min-height:100vh;
}
#root{min-height:100vh;}
h1,h2,h3,h4,.display{font-family:var(--font-display); letter-spacing:-0.01em;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
.container{max-width:1180px;margin:0 auto;padding:0 24px;}
.wide-scroll{overflow-x:auto;}
::selection{background:var(--indigo); color:white;}

/* Buttons */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 22px; border-radius:11px; font-weight:600; font-size:15px;
  border:1px solid transparent; transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--indigo); color:#fff;}
.btn-primary:hover{background:var(--indigo-dark);}
.btn-outline{background:transparent; border-color:var(--border); color:var(--text);}
.btn-outline:hover{border-color:var(--indigo); color:var(--indigo);}
.btn-ghost{background:transparent; color:var(--text-soft); padding:10px 14px;}
.btn-ghost:hover{color:var(--text);}
.btn-sm{padding:8px 14px; font-size:13px; border-radius:9px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.5; cursor:not-allowed;}

/* Card */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  box-shadow: var(--shadow);
}
.card-pad{padding:22px;}

/* Inputs */
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:16px;}
.field label{font-size:13px; font-weight:600; color:var(--text-soft);}
.field input, .field select, .field textarea{
  border:1.5px solid var(--border); border-radius:10px; padding:11px 13px; font-size:14.5px;
  background:var(--bg-alt); color:var(--text); font-family:inherit; outline:none;
  transition:border-color .12s ease;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--indigo);}
.field .hint{font-size:12px; color:var(--text-faint);}
.field .error{font-size:12.5px; color:var(--red); font-weight:500;}

.chip-select{display:flex; flex-wrap:wrap; gap:8px;}
.chip{
  padding:7px 13px; border-radius:999px; border:1.5px solid var(--border); font-size:13.5px;
  background:var(--bg-alt); color:var(--text-soft); font-weight:500; transition:all .12s ease;
}
.chip.active{background:var(--indigo); border-color:var(--indigo); color:#fff;}

/* Badge */
.badge{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:7px; font-size:12.5px; font-weight:600;}
.badge-skill{background:var(--surface-2); color:var(--indigo);}
.badge-missing{background:rgba(214,68,106,0.1); color:var(--red);}
.badge-domain{background:rgba(47,111,237,0.1); color:var(--blue);}

/* Navbar */
.navbar{
  position:sticky; top:0; z-index:40; background:rgba(246,245,252,0.86); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
:root[data-theme="dark"] .navbar, :root:not([data-theme="light"]) .navbar{background:rgba(22,20,42,0.86);}

.logo{display:flex; align-items:center; gap:9px; font-family:var(--font-display); font-weight:700; font-size:19px;}
.logo-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--indigo),var(--violet)); display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700;}
.nav-links{display:flex; align-items:center; gap:2px;}
.nav-link{padding:9px 14px; border-radius:9px; font-size:14.5px; font-weight:600; color:var(--text-soft); border:none; background:transparent;}
.nav-link.active{color:var(--indigo); background:var(--surface-2);}
.nav-link:hover{color:var(--indigo);}

/* Progress bar */
.progress-track{width:100%; height:9px; border-radius:99px; background:var(--surface-2); overflow:hidden;}
.progress-fill{height:100%; border-radius:99px; transition:width .5s ease;}

/* Match ring */
.match-ring{position:relative; display:flex; align-items:center; justify-content:center;}
.match-ring svg{transform:rotate(-90deg);}
.match-ring .val{position:absolute; font-family:var(--font-display); font-weight:700;}

/* Layout helpers */
.grid{display:grid; gap:20px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:900px){ .grid-2,.grid-3,.grid-4{grid-template-columns:1fr;} }
@media (max-width:900px){ .hide-mobile{display:none;} }
@media (min-width:901px){ .show-mobile{display:none;} }

.page-enter{animation:fadeUp .35s ease both;}
@keyframes fadeUp{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

.divider{height:1px; background:var(--border); border:none; margin:22px 0;}

.empty-state{text-align:center; padding:60px 20px; color:var(--text-faint);}

/* Assistant */
.assistant-fab{
  position:fixed; bottom:22px; right:22px; z-index:50; width:58px; height:58px; border-radius:50%;
  background:linear-gradient(135deg,var(--indigo),var(--violet)); color:#fff; display:flex; align-items:center;
  justify-content:center; font-size:24px; box-shadow:0 10px 30px rgba(79,63,224,0.4); border:none;

.assistant-panel{
  position:fixed; bottom:92px; right:22px; z-index:50; width:360px; max-width:calc(100vw - 32px);
  height:480px; max-height:calc(100vh - 140px); background:var(--surface); border:1px solid var(--border);

.assistant-header{padding:16px 18px; background:linear-gradient(135deg,var(--indigo),var(--violet)); color:#fff;}
.assistant-msgs{flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px;}
.msg{max-width:85%; padding:10px 13px; border-radius:13px; font-size:13.8px; line-height:1.45; white-space:pre-wrap;}
.msg.user{align-self:flex-end; background:var(--indigo); color:#fff; border-bottom-right-radius:4px;}
.msg.bot{align-self:flex-start; background:var(--surface-2); color:var(--text); border-bottom-left-radius:4px;}
.assistant-suggest{display:flex; flex-wrap:wrap; gap:6px; padding:0 14px 10px;}
.assistant-input{display:flex; gap:8px; padding:12px; border-top:1px solid var(--border);}
.assistant-input input{flex:1; border:1.5px solid var(--border); border-radius:10px; padding:9px 12px; background:var(--bg-alt); color:var(--text); font-size:13.5px; outline:none;}

::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}

.link-btn{background:none;border:none;color:var(--indigo);font-weight:600;font-size:inherit;padding:0;}
.link-btn:hover{text-decoration:underline;}
</style>

/* ============================= STORAGE HELPERS ============================= */

function loadLS(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    if(raw === null || raw === undefined) return fallback;
    return JSON.parse(raw);
  }catch(e){ return fallback; }
}
function saveLS(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch(e){ return false; }
}

function emptyProfile(name, email){

    preferredLocation:"", workMode:"Remote"
  };
}

};

/* ============================= MATCH ENGINE ============================= */

function calculateMatch(profile, internship){
  const skills = profile.skills || [];
  const required = internship.requiredSkills || [];
  const preferred = internship.preferredSkills || [];

  const matchingSkills = required.filter(s => skills.includes(s));
  const missingSkills = required.filter(s => !skills.includes(s));
  const matchingPreferred = preferred.filter(s => skills.includes(s));

  const skillScore = required.length === 0 ? 1 : (matchingSkills.length / required.length);
  const bonus = preferred.length === 0 ? 0 : Math.min(0.1, (matchingPreferred.length / preferred.length) * 0.1);
  const skillComponent = Math.min(1, skillScore + bonus) * 50;

  const interestMatch = (profile.interests || []).includes(internship.domain);
  const domainComponent = (interestMatch ? 1 : (profile.preferredDomain === internship.domain ? 0.6 : 0)) * 25;

  const profileRank = EXP_RANK[profile.experience] || 1;
  const reqRank = EXP_RANK[internship.experienceLevel] || 1;
  let expFactor;
  if(profileRank >= reqRank) expFactor = 1;
  else if(profileRank === reqRank - 1) expFactor = 0.55;
  else expFactor = 0.15;
  const experienceComponent = expFactor * 15;

  let locFactor = 0;
  if(profile.workMode && internship.remote && profile.workMode === internship.remote) locFactor += 0.6;
  if(profile.preferredLocation && internship.location.toLowerCase().includes(profile.preferredLocation.toLowerCase())) locFactor += 0.4;
  if(internship.remote === "Remote") locFactor = Math.max(locFactor, 0.7);
  locFactor = Math.min(1, locFactor);
  const locationComponent = locFactor * 10;

  const rawScore = skillComponent + domainComponent + experienceComponent + locationComponent;
  const score = Math.round(Math.max(0, Math.min(100, rawScore)));

  let explanation = "";
  if(matchingSkills.length > 0){
    explanation += `You already have ${matchingSkills.length} of the ${required.length} required skill${required.length===1?"":"s"} (${matchingSkills.join(", ")}). `;
  } else if(required.length > 0){
    explanation += `You don't yet have any of the required skills for this role. `;
  }
  if(interestMatch){
    explanation += `It also matches your stated interest in ${internship.domain}. `;
  }
  if(missingSkills.length > 0){
    explanation += `Learning ${missingSkills.join(", ")} would strengthen your eligibility.`;
  } else if(required.length > 0){
    explanation += `You meet every required skill for this role.`;
  }

  let matchLabel = "Explore";
  if(score >= 90) matchLabel = "Excellent Match";
  else if(score >= 75) matchLabel = "Strong Match";
  else if(score >= 60) matchLabel = "Good Match";

  return { score, matchingSkills, missingSkills, matchingPreferred, explanation: explanation.trim(), matchLabel };
}

function rankInternships(profile){
  return INTERNSHIPS.map(i => ({ internship: i, ...calculateMatch(profile, i) }))
    .sort((a,b) => b.score - a.score);
}

    chat: <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>,
    warning: <><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>,
    edit: <><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></>,
  };
  return <svg {...common}>{paths[name] || null}</svg>;
}

function ScoreColor(score){
  if(score >= 90) return "var(--green)";
  if(score >= 75) return "var(--indigo)";
  if(score >= 60) return "var(--blue)";
  return "var(--amber)";
}

function MatchRing({ score, size=64 }){
  const stroke = 6;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const offset = c - (score/100) * c;
  const color = ScoreColor(score);
  return (
    <div className="match-ring" style={{width:size, height:size}}>
      <svg width={size} height={size}>
        <circle cx={size/2} cy={size/2} r={r} stroke="var(--surface-2)" strokeWidth={stroke} fill="none" />
        <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke} fill="none"
          strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round" />
      </svg>
      <div className="val" style={{fontSize:size*0.26, color}}>{score}</div>
    </div>
  );
}

function ProgressBar({ value, max=100, color }){
  const pct = Math.max(0, Math.min(100, (value/max)*100));
  return (
    <div className="progress-track">
      <div className="progress-fill" style={{ width: pct+"%", background: color || "var(--indigo)" }}></div>
    </div>
  );
}

function SkillBadge({ skill, kind="skill" }){
  const cls = kind === "missing" ? "badge badge-missing" : "badge badge-skill";
  return <span className={cls}>{kind === "missing" ? <Icon name="warning" size={12}/> : <Icon name="check" size={12}/>}{skill}</span>;
}

function MatchTag({ label, score }){
  return <span className="badge" style={{ background: ScoreColor(score)+"1A", color: ScoreColor(score) }}>{label} · {score}%</span>;
}

/* ============================= AI ASSISTANT ============================= */

function buildAssistantReply(question, profile, ranked, hasProfile){
  const q = question.toLowerCase();

  if(!hasProfile){
    return "Your profile is still empty, so I can't personalize an answer yet. Head to Profile and add your skills and interests — then ask me again.";
  }

  if(/best|suited|which internship/.test(q)){
    const top = ranked[0];
    if(!top) return "I couldn't find a strong match yet — try adding more skills to your profile.";
    return `Based on your profile, ${top.internship.title} at ${top.internship.company} is your best match at ${top.score}% (${top.matchLabel}). ${top.explanation}`;
  }

  if(/skill|learn/.test(q) && /ai|ml|machine learning/.test(q)){
    return "For AI/ML internships on this board, Python and TensorFlow show up the most, with SQL and Git also commonly requested. Start with Python fundamentals, then move to a small TensorFlow project.";
  }

  if(/what skill|learn|improve|upskill/.test(q)){
    const counts = {};
    ranked.slice(0,6).forEach(r => r.missingSkills.forEach(s => counts[s]=(counts[s]||0)+1));
    const top3 = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>e[0]);
    if(top3.length===0) return "You're not missing any skills across your top matches right now — great position to be in.";
    return `Across your closest matches, the most valuable skills to add are ${top3.join(", ")}. Adding even one of these would raise several of your match scores.`;
  }

  if(/why.*score|explain.*match|how.*match.*calculat/.test(q)){
    const top = ranked[0];
    const detail = top ? ` For example, your top match, ${top.internship.title}, scored ${top.score}% because: ${top.explanation}` : "";
    return `Match scores combine four things: skills overlap (50%), interest/domain fit (25%), experience level vs. eligibility (15%), and location/work-mode preference (10%).${detail}`;
  }

  if(/add.*profile|profile.*add|missing.*profile/.test(q)){
    const missing = [];
    if(!profile.college) missing.push("college");
    if(!profile.course) missing.push("course");
    if(!profile.year) missing.push("year");
    if(profile.skills.length < 3) missing.push("a few more skills");
    if(profile.interests.length === 0) missing.push("at least one interest");
    if(missing.length === 0) return "Your profile looks solid. You could still raise your scores by adding any newly learned skills as you pick them up.";
    return `Adding ${missing.join(", ")} to your profile would improve how accurately I can match you.`;
  }

  if(/how many|count/.test(q) && /internship/.test(q)){
    const suitable = ranked.filter(r=>r.score>=60).length;
    return `You have ${suitable} internship${suitable===1?"":"s"} scoring 60% or higher out of ${ranked.length} total listings.`;
  }

  return "I can help with things like: \"Which internship is best suited to my skills?\", \"What skills should I learn for AI internships?\", \"Why did I get this match score?\", or \"What should I add to my profile?\" Try one of those, or rephrase your question.";
}

function AIAssistant({ profile, hasProfile }){
  const [open, setOpen] = useState(false);
  const [messages, setMessages] = useState([
    { role:"bot", text:"Hi, I'm SmartIntern AI. Ask me about your matches, skill gaps, or what to add to your profile." }
  ]);
  const [input, setInput] = useState("");
  const ranked = useMemo(()=>rankInternships(profile), [profile]);
  const scrollRef = useRef(null);

  useEffect(()=>{
    if(scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, open]);

  function send(text){
    const t = (text !== undefined ? text : input).trim();
    if(!t) return;
    const reply = buildAssistantReply(t, profile, ranked, hasProfile);
    setMessages(m => [...m, { role:"user", text:t }, { role:"bot", text:reply }]);
    setInput("");
  }

  const suggestions = ["Which internship is best suited to my skills?", "What skills should I learn?", "Why did I get this match score?"];

  return (
    <>
      <button className="assistant-fab" onClick={()=>setOpen(o=>!o)} title="SmartIntern AI"><Icon name="chat" size={24}/></button>
      {open && (
        <div className="assistant-panel">
          <div className="assistant-header">
            <div style={{fontWeight:700, fontSize:15}}>SmartIntern AI</div>
            <div style={{fontSize:12, opacity:0.85}}>Answers use your profile and live internship data</div>
          </div>
          <div className="assistant-msgs" ref={scrollRef}>
            {messages.map((m,idx) => <div key={idx} className={"msg " + m.role}>{m.text}</div>)}
          </div>
          <div className="assistant-suggest">
            {suggestions.map(s => <button key={s} className="chip" style={{fontSize:12}} onClick={()=>send(s)}>{s}</button>)}
          </div>
          <div className="assistant-input">
            <input value={input} onChange={e=>setInput(e.target.value)} placeholder="Ask a question…"
              onKeyDown={e=>{ if(e.key==="Enter") send(); }} />
            <button className="btn btn-primary btn-sm" onClick={()=>send()}>Send</button>
          </div>
        </div>
      )}
    </>
  );
}

function App(){
  const [session, setSession] = useState(()=>loadLS("smartintern_session", null));
  const [view, setView] = useState(()=> session ? "dashboard" : "landing");
  const [internshipId, setInternshipId] = useState(null);
  const [prevView, setPrevView] = useState("internships");
  const [justRegistered, setJustRegistered] = useState(false);

  const [profiles, setProfiles] = useState(()=>loadLS("smartintern_profiles", {}));
  const profile = session ? (profiles[session] || emptyProfile("", session)) : emptyProfile();
  const hasProfile = !!(profile.skills.length>0 && profile.interests.length>0);

  function go(v){ setView(v); window.scrollTo(0,0); }

  function openInternship(id){ setPrevView(view === "internships-preview" ? "internships-preview" : view); setInternshipId(id); setView("detail"); }
  function backFromDetail(){ setView(prevView); }

  function handleLogin(email){
    saveLS("smartintern_session", email);
    setSession(email);
    setJustRegistered(false);
    go("dashboard");
  }
  function handleRegister(email){
    saveLS("smartintern_session", email);
    setSession(email);
    setProfiles(loadLS("smartintern_profiles", {}));
    setJustRegistered(true);
    go("profile");
  }
  function handleLogout(){
    localStorage.removeItem("smartintern_session");
    setSession(null);
    go("landing");
  }
  function startDemo(){
    const users = loadLS("smartintern_users", []);
    if(!users.find(u => u.email.toLowerCase() === DEMO_EMAIL)){
      users.push({ name:"Demo Student", email: DEMO_EMAIL, password: DEMO_PASSWORD });
      saveLS("smartintern_users", users);
    }
    const all = loadLS("smartintern_profiles", {});
    if(!all[DEMO_EMAIL]){
      all[DEMO_EMAIL] = { ...emptyProfile("Demo Student", DEMO_EMAIL), ...DEMO_PROFILE_FIELDS };
      saveLS("smartintern_profiles", all);
    }
    setProfiles(all);
    saveLS("smartintern_session", DEMO_EMAIL);
    setSession(DEMO_EMAIL);
    setJustRegistered(false);
    go("dashboard");
  }
  function saveProfile(newProfile){
    const all = loadLS("smartintern_profiles", {});
    all[session] = newProfile;
    saveLS("smartintern_profiles", all);
    setProfiles(all);
  }

  const guardedGo = (v) => {
    const protectedViews = ["dashboard","internships","recommendations","skillgap","profile"];
    if(protectedViews.includes(v) && !session){ go("login"); return; }
    go(v);
  };

  let content;
  if(view === "landing") content = <LandingPage go={guardedGo} onDemo={startDemo} />;
  else if(view === "internships-preview") content = <InternshipsPage profile={emptyProfile()} openInternship={(id)=>{ setPrevView("internships-preview"); setInternshipId(id); setView("detail"); }} hasProfile={false} />;
  else if(view === "login") content = <LoginPage go={go} onLogin={handleLogin} onDemo={startDemo} />;
  else if(view === "register") content = <RegisterPage go={go} onRegister={handleRegister} onDemo={startDemo} />;
  else if(!session) content = <LoginPage go={go} onLogin={handleLogin} onDemo={startDemo} />;
  else if(view === "profile") content = <ProfilePage profile={profile} saveProfile={saveProfile} go={go} justRegistered={justRegistered} />;
  else if(view === "dashboard") content = <Dashboard profile={profile} go={guardedGo} openInternship={openInternship} />;
  else if(view === "internships") content = <InternshipsPage profile={profile} openInternship={openInternship} hasProfile={hasProfile} />;
  else if(view === "recommendations") content = <RecommendationsPage profile={profile} openInternship={openInternship} hasProfile={hasProfile} go={guardedGo} />;
  else if(view === "skillgap") content = <SkillGapPage profile={profile} go={guardedGo} hasProfile={hasProfile} />;
  else if(view === "detail") content = <InternshipDetail internshipId={internshipId} profile={profile} back={backFromDetail} hasProfile={session ? hasProfile : false} go={guardedGo} />;
  else content = <LandingPage go={guardedGo} />;

  return (
    <div>
      <Navbar view={view} go={guardedGo} session={session} logout={handleLogout} />
      {content}
      {session && <AIAssistant profile={profile} hasProfile={hasProfile} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
